<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSA Prep</title>
<!-- Only this app's own files and the named CDNs may load; no inline scripts (blocks injected HTML from running). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 28 28'%3E%3Crect width='28' height='28' rx='8' fill='%235b5bd6'/%3E%3Cpath d='M14 9.5 9.5 17M14 9.5l4.5 7.5' stroke='white' stroke-width='1.8' stroke-linecap='round'/%3E%3Ccircle cx='14' cy='9' r='2.6' fill='white'/%3E%3Ccircle cx='9' cy='18.5' r='2.6' fill='white'/%3E%3Ccircle cx='19' cy='18.5' r='2.6' fill='white'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="js/theme-init.js"></script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <button class="brand" id="brand" title="Go to Home">
      <svg class="logo" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="var(--accent)"/><path d="M14 9.5 9.5 17M14 9.5l4.5 7.5" stroke="var(--accent-ink)" stroke-width="1.8" stroke-linecap="round"/><circle cx="14" cy="9" r="2.6" fill="var(--accent-ink)"/><circle cx="9" cy="18.5" r="2.6" fill="var(--accent-ink)"/><circle cx="19" cy="18.5" r="2.6" fill="var(--accent-ink)"/></svg>
      <span class="brand-text"><b>DSA Prep</b><small>Toronto &amp; KW</small></span>
    </button>
    <nav id="nav" aria-label="Main">
      <button title="Home: how the app works" data-nav="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/></svg><span>Home</span></button>
      <span class="nav-sep" aria-hidden="true"></span>
      <button title="Step 1: Learn" data-nav="learn"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5z"/><path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg><span><b class="nav-n">1</b>Learn</span></button>
      <button title="Step 2: Problems" data-nav="problems"><svg viewBox="0 0 24 24"><path d="m8 8-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/></svg><span><b class="nav-n">2</b>Problems</span></button>
      <button title="Step 3: Roadmap" data-nav="roadmap"><svg viewBox="0 0 24 24"><path d="M9 4 3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span><b class="nav-n">3</b>Roadmap</span></button>
      <span class="nav-sep" aria-hidden="true"></span>
      <button title="Interview" data-track="interview"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.6A8 8 0 1 1 21 12z"/><path d="M8.5 10.5h7M8.5 13.5h4.5"/></svg><span>Interview</span></button>
      <button title="Companies" data-nav="companies"><svg viewBox="0 0 24 24"><path d="M4 21V5a1 1 0 0 1 1-1h9a1 1 0 0 1 1 1v16M15 9h4a1 1 0 0 1 1 1v11M3 21h18M8 8h3M8 12h3M8 16h3"/></svg><span>Companies</span></button>
      <button title="Settings" data-nav="settings"><svg viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/></svg><span>Settings</span></button>
    </nav>
    <button class="search-btn" id="search-open" title="Search (Ctrl+K)" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span><kbd>Ctrl K</kbd></button>
    <button class="icon-btn" id="theme-quick" title="Toggle light / dark" aria-label="Toggle light or dark theme"></button>
  </div>
  <nav id="subnav" class="subnav" aria-label="Section" hidden></nav>
</header>
<main id="view"></main>
<!-- Content: plain data in globals, loaded first. Solutions, prompts and tests load on demand
     (loadContent in js/workspace.js). -->
<script src="data/data.js"></script>
<script src="data/faang.js"></script>
<script src="data/lessons/principles.js"></script>
<script src="data/lessons/refresher.js"></script>
<script src="data/lessons/bigo.js"></script>
<script src="data/lessons/datastructures.js"></script>
<script src="data/lessons/patterns.js"></script>
<script src="data/videos.js"></script>
<script src="data/lessons/langlessons.js"></script>
<!-- App: views and logic; app.js last, it renders the first page -->
<script src="js/codecolors.js"></script>
<script src="js/checker.js"></script>
<script src="js/workspace.js"></script>
<script src="js/nav.js"></script>
<script src="js/interview.js"></script>
<script src="js/router.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
<!-- Syntax colours, self-hosted (a module: runs after the first render, then colours the page) -->
<script type="module" src="js/highlight.js"></script>
</body>
</html>
